plugins {
    id 'com.android.application'
}

android {
    namespace 'it.helixpresets'
    compileSdk 34

    defaultConfig {
        applicationId 'it.helixpresets'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
// Nessuna dipendenza esterna: solo le API di Android.
